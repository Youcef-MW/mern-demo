services:
  mongodb:
    image: mongo:6
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - mern-network
 
  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    environment:
      - MONGO_URI=mongodb://mongodb:27018/merndb
      - PORT=4000
    ports:
      - "4000:4000"
    depends_on:
      - mongodb
    networks:
      - mern-network
 
  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:8081"
    depends_on:
      - backend
    networks:
      - mern-network
 
volumes:
  mongo_data:
 
networks:
  mern-network:
    driver: bridge